# Visible display name of the workflow in Github's interface
name: Core CI Pipeline

# The event triggers that kick off the automation
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        name: Build and Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install -y libgtest-dev

            - name: Configure
              run: cmake -B build -DCMAKE_BUILD_TYPE=Release

            - name: Build
              run: cmake --build build -j$(nproc)


            - name: Test
              run: ctest --test-dir build --output-on-failure